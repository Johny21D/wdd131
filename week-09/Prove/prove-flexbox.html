<!DOCTYPE html>
<html lang="en">
<head>

    <title>Recipe Book | Apple Crisp</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Delicious Apple Crisp Recipe">
    <meta property="og:description" content="Learn how to make the perfect, crunchy apple crisp at home.">

<body>

    <header>
        <div class="logo-area">
            <img src="../Prove/images/recipe-book.png" alt="Recipe Book Logo" class="logo">

        </div>
        <form class="search-area">
            <input type="text" placeholder="Search recipes...">
            <button type="submit"><img src="../Prove/images/search.svg" alt="Search"></button>
        </form>

    <main>
        <section class="recipe-card">
            <img src="images/apple-crisp.jpg" alt="Homemade Apple Crisp" class="recipe-img">
            
            <div class="recipe-content">
                <h2>Apple Crisp</h2>
                
                <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">

                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>

                <p class="description">This apple crisp is the perfect balance of tart apples and a sweet, crunchy oat topping.</p>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
