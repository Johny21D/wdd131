<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Card Checkout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <form class="Bank-Card" id="checkoutForm">
        
        <div id="front-card">
            <div class="total">TOTAL: $199</div>

            <div class="number-group">
                <label for="cardNumber">Card Number</label>
                <input type="text" id="cardNumber" placeholder="1234567890123456" required maxlength="16">
            </div>

            <div class="holder-group">
                <label for="cardHolder">Card Holder</label>
                <input type="text" id="cardHolder" placeholder="Brother Keer" required>
            </div>

            <div id="cardExpiration">
                <label>Expiration</label>
                <div class="exp-row">
                    <input type="text" id="month" placeholder="MM" maxlength="2" required>
                    <span class="sep">/</span>
                    <input type="text" id="year" placeholder="YY" maxlength="2" required>
                </div>
            </div>
        </div>

        <div id="back-card">
            <div class="cvv-group">
                <label for="cvv">CVC/CVV</label>
                <input type="text" id="cvv" placeholder="XXX" maxlength="3" required>
            </div>
        </div>

        <div class="errors" style="grid-column: 1 / 4; color: red; font-size: 13px; text-align: center;"></div>

        <button type="submit">Submit</button>
    </form>

    <script src="creditcard.js" defer></script>
</body>
</html>
